name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 12 * * 5'  # Every Friday at 12:30 UTC

permissions:
  contents: read

jobs:
  # ── .NET NuGet vulnerability scan ────────────────────────────────────────
  dotnet-audit:
    name: .NET Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln-report.txt
        working-directory: backend

      - name: Fail on critical vulnerabilities
        run: |
          if grep -q "Critical\|High" /tmp/vuln-report.txt; then
            echo "Critical or High vulnerabilities found:"
            cat /tmp/vuln-report.txt
            exit 1
          fi

  # ── npm audit ─────────────────────────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      # Gate on what ships: the production dependency tree must have no high/critical advisory.
      - name: Run npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      # Dev-only tooling (vite/vitest build + test chain) is reported but not gating: some
      # advisories there have no patched release yet (e.g. picomatch <=4.0.7, GHSA-fc5q-39xc-vjpf)
      # and never reach the shipped bundle. Keep it visible in the log so it gets bumped once fixed.
      - name: Report npm audit (all dependencies, incl. dev)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity advisories in dev-only dependencies (see log)."
        working-directory: frontend

  # ── License compliance ────────────────────────────────────────────────────
  license-check:
    name: Frontend License Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Check licenses (no GPL / AGPL)
        working-directory: frontend
        run: |
          # Installed pinned + without lifecycle scripts into a scratch prefix (not a devDependency,
          # which would pull its large npm-internals tree into the app's lockfile).
          npm install --ignore-scripts --no-save --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/license-checker" license-checker-rseidelsohn@5.0.1
          "$RUNNER_TEMP/license-checker/node_modules/.bin/license-checker-rseidelsohn" --summary \
            --failOn "GPL;AGPL" \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0" \
            || echo "Warning: Unlisted or restrictive licenses found"
